<p-toolbar>
  <div class="p-toolbar-group-start">
    <i class="pi pi-bolt" style="font-size: 1.5rem; margin-right: 0.5rem;"></i>
    <span class="app-title">GymApp</span>
  </div>
  <div class="p-toolbar-group-end">
    <p-button
      label="Wyloguj"
      icon="pi pi-sign-out"
      severity="secondary"
      [outlined]="true"
      (onClick)="logout()" />
  </div>
</p-toolbar>

<div class="dashboard-content">
  <p-card header="Witaj w GymApp! 💪">
    <p>Dashboard jest gotowy do rozbudowy.</p>
  </p-card>
</div>
