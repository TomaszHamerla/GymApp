# Database properties
spring.datasource.url=jdbc:postgresql://localhost:5433/spring_db
spring.datasource.username=spring_user
spring.datasource.password=spring_password
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA properties
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# JWT properties
jwt.secret=9a4f2c8d3b7a1e6f45c8a0b3f267d8b1d4e6f3c8a9d2b5f8e3a9c8b5f6v8a3d9
jwt.expiration=86400000

# Throw NoHandlerFoundException for missing handlers (404)
spring.web.resources.add-mappings=false
