<p-toast position="bottom-center" />

<div class="auth-container">
  <div class="auth-card-wrapper">
    <div class="auth-header">
      <i class="pi pi-bolt auth-icon"></i>
      <h1>GymApp</h1>
      <p>Twój osobisty tracker treningów</p>
    </div>

    <p-card>
      <p-tabView [(activeIndex)]="activeTabIndex">
        <!-- LOGIN TAB -->
        <p-tabPanel header="Logowanie" leftIcon="pi pi-sign-in">
          <div class="form-container">
            <div class="field">
              <p-floatLabel>
                <input
                  pInputText
                  id="login-email"
                  type="email"
                  [(ngModel)]="loginEmail"
                  (keydown.enter)="onLogin()"
                  class="w-full" />
                <label for="login-email">Email</label>
              </p-floatLabel>
            </div>

            <div class="field">
              <p-floatLabel>
                <p-password
                  id="login-password"
                  [(ngModel)]="loginPassword"
                  [feedback]="false"
                  [toggleMask]="true"
                  (keydown.enter)="onLogin()"
                  styleClass="w-full"
                  inputStyleClass="w-full" />
                <label for="login-password">Hasło</label>
              </p-floatLabel>
            </div>

            <div class="forgot-password-row">
              <button
                type="button"
                class="forgot-password-link"
                (click)="openForgotPasswordDialog()">
                Zapomniałeś hasła?
              </button>
            </div>

            <p-button
              label="Zaloguj się"
              icon="pi pi-sign-in"
              (onClick)="onLogin()"
              [loading]="loginLoading"
              styleClass="w-full"
              severity="primary" />
          </div>
        </p-tabPanel>

        <!-- REGISTER TAB -->
        <p-tabPanel header="Rejestracja" leftIcon="pi pi-user-plus">
          <div class="form-container">
            <div class="field">
              <p-floatLabel>
                <input
                  pInputText
                  id="register-email"
                  type="email"
                  [(ngModel)]="registerEmail"
                  class="w-full" />
                <label for="register-email">Email</label>
              </p-floatLabel>
            </div>

            <div class="field">
              <p-floatLabel>
                <p-password
                  id="register-password"
                  [(ngModel)]="registerPassword"
                  [toggleMask]="true"
                  styleClass="w-full"
                  inputStyleClass="w-full" />
                <label for="register-password">Hasło</label>
              </p-floatLabel>
            </div>

            <div class="field">
              <p-floatLabel>
                <p-password
                  id="register-confirm-password"
                  [(ngModel)]="registerConfirmPassword"
                  [feedback]="false"
                  [toggleMask]="true"
                  (keydown.enter)="onRegister()"
                  styleClass="w-full"
                  inputStyleClass="w-full" />
                <label for="register-confirm-password">Powtórz hasło</label>
              </p-floatLabel>
            </div>

            <p-button
              label="Zarejestruj się"
              icon="pi pi-user-plus"
              (onClick)="onRegister()"
              [loading]="registerLoading"
              styleClass="w-full"
              severity="primary" />
          </div>
        </p-tabPanel>
      </p-tabView>
    </p-card>

    <div class="auth-footer">
      <span>Build: {{ buildInfo.buildDate }}</span>
      <span *ngIf="buildInfo.gitCommit" class="build-commit">({{ buildInfo.gitCommit }})</span>
    </div>
  </div>
</div>

<p-dialog
  header="Resetowanie hasła"
  [(visible)]="showForgotPasswordDialog"
  [modal]="true"
  [draggable]="false"
  [resizable]="false"
  [style]="{ width: '90%', maxWidth: '420px' }">
  <p class="dialog-description">
    Podaj swój adres e-mail przypisany do konta. Wyślemy na niego link umożliwiający ustawienie nowego hasła.
  </p>

  <div class="field forgot-dialog-field">
    <p-floatLabel>
      <input
        pInputText
        id="forgot-email"
        type="email"
        [(ngModel)]="forgotEmail"
        (keydown.enter)="onSendResetLink()"
        class="w-full" />
      <label for="forgot-email">Adres e-mail</label>
    </p-floatLabel>
  </div>

  <ng-template pTemplate="footer">
    <div class="dialog-footer-actions">
      <p-button
        label="Anuluj"
        icon="pi pi-times"
        (onClick)="showForgotPasswordDialog = false"
        severity="secondary"
        [text]="true" />
      <p-button
        label="Wyślij link"
        icon="pi pi-send"
        (onClick)="onSendResetLink()"
        [loading]="forgotLoading"
        severity="primary" />
    </div>
  </ng-template>
</p-dialog>
