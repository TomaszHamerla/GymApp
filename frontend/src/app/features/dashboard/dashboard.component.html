<div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-8">
  <div class="flex justify-between items-center mb-8">
    <h1 class="text-3xl font-bold text-gray-900">Dashboard</h1>
    <button pButton icon="pi pi-sign-out" label="Logout" (click)="logout()" class="p-button-outlined p-button-danger"></button>
  </div>

  <div class="grid grid-cols-1 md:grid-cols-2 gap-8">
    <!-- Add Workout Form -->
    <p-card header="Log New Workout">
      <form [formGroup]="workoutForm" (ngSubmit)="onSubmit()" class="space-y-4">
        <div class="flex flex-col gap-2">
          <label for="exercise" class="font-medium">Exercise</label>
          <p-dropdown id="exercise" formControlName="exerciseId" [options]="exercises" optionLabel="name" optionValue="id" placeholder="Select an exercise" styleClass="w-full"></p-dropdown>
        </div>

        <div class="grid grid-cols-3 gap-4">
          <div class="flex flex-col gap-2">
            <label for="sets" class="font-medium">Sets</label>
            <p-inputNumber id="sets" formControlName="sets" [showButtons]="true" inputId="minmax-buttons" [min]="1" [max]="100" styleClass="w-full"></p-inputNumber>
          </div>
          <div class="flex flex-col gap-2">
            <label for="reps" class="font-medium">Reps</label>
            <p-inputNumber id="reps" formControlName="reps" [showButtons]="true" inputId="minmax-buttons" [min]="1" [max]="100" styleClass="w-full"></p-inputNumber>
          </div>
          <div class="flex flex-col gap-2">
            <label for="weight" class="font-medium">Weight (kg)</label>
            <p-inputNumber id="weight" formControlName="weight" mode="decimal" [minFractionDigits]="1" [maxFractionDigits]="2" styleClass="w-full"></p-inputNumber>
          </div>
        </div>

        <button pButton type="submit" label="Save Workout" [disabled]="workoutForm.invalid" class="w-full mt-4"></button>
      </form>
    </p-card>

    <!-- Latest Workout -->
    <p-card header="Latest Workout">
      <div *ngIf="latestWorkout; else noWorkout">
        <div class="flex items-center justify-between border-b pb-4 mb-4">
          <div>
            <span class="text-gray-500 text-sm">Date</span>
            <p class="font-medium">{{ latestWorkout.createdAt | date:'medium' }}</p>
          </div>
          <div class="text-right">
            <span class="text-gray-500 text-sm">Exercise</span>
            <p class="font-medium text-lg text-blue-600">{{ latestWorkout.exercise?.name }}</p>
          </div>
        </div>
        <div class="grid grid-cols-3 gap-4 text-center">
          <div class="bg-gray-50 p-4 rounded">
            <span class="block text-gray-500 text-sm">Sets</span>
            <span class="block text-xl font-bold">{{ latestWorkout.sets }}</span>
          </div>
          <div class="bg-gray-50 p-4 rounded">
            <span class="block text-gray-500 text-sm">Reps</span>
            <span class="block text-xl font-bold">{{ latestWorkout.reps }}</span>
          </div>
          <div class="bg-gray-50 p-4 rounded">
            <span class="block text-gray-500 text-sm">Weight</span>
            <span class="block text-xl font-bold">{{ latestWorkout.weight }} kg</span>
          </div>
        </div>
      </div>
      <ng-template #noWorkout>
        <div class="text-center text-gray-500 py-8">
          <i class="pi pi-inbox text-4xl mb-2"></i>
          <p>No workouts recorded yet.</p>
        </div>
      </ng-template>
    </p-card>
  </div>
</div>
