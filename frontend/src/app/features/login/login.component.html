<div class="flex items-center justify-center min-h-[calc(100vh-64px)]">
  <div class="w-full max-w-md p-8 space-y-6 bg-white rounded-lg shadow-md">
    <h2 class="text-2xl font-bold text-center text-gray-800">Sign in to your account</h2>
    <form [formGroup]="loginForm" (ngSubmit)="onSubmit()" class="space-y-4">
      <div class="flex flex-col gap-2">
        <label for="email" class="font-medium">Email</label>
        <input pInputText id="email" formControlName="email" type="email" class="w-full p-2 border rounded" />
      </div>
      <div class="flex flex-col gap-2">
        <label for="password" class="font-medium">Password</label>
        <p-password id="password" formControlName="password" [feedback]="false" [toggleMask]="true" styleClass="w-full" inputStyleClass="w-full p-2 border rounded"></p-password>
      </div>
      <div *ngIf="error" class="text-red-500 text-sm">{{error}}</div>
      <button pButton type="submit" label="Sign in" [disabled]="loginForm.invalid" class="w-full py-2 bg-blue-600 text-white rounded hover:bg-blue-700"></button>
    </form>
    <p class="text-sm text-center text-gray-600">
      Don't have an account? <a routerLink="/register" class="text-blue-600 hover:underline">Sign up</a>
    </p>
  </div>
</div>
